<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600">
    <!-- Definitions for gradients and filters -->
    <defs>
        <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" style="stop-color:#4e73df;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#224abe;stop-opacity:1" />
        </linearGradient>
        <linearGradient id="successGrad" x1="0%" y1="0%" x2="100%" y2="0%">
            <stop offset="0%" style="stop-color:#1cc88a;stop-opacity:1" />
            <stop offset="100%" style="stop-color:#13855c;stop-opacity:1" />
        </linearGradient>
        <filter id="dropShadow" x="-20%" y="-20%" width="140%" height="140%">
            <feDropShadow dx="0" dy="10" stdDeviation="15" flood-color="#000" flood-opacity="0.1"/>
        </filter>
    </defs>

    <!-- Background Elements -->
    <circle cx="400" cy="300" r="300" fill="#ffffff" opacity="0.05"/>
    
    <!-- Main Dashboard Interface Illustration -->
    <g filter="url(#dropShadow)">
        <!-- Window Frame -->
        <rect x="100" y="100" width="600" height="400" rx="12" fill="#ffffff"/>
        
        <!-- Sidebar -->
        <path d="M100,112 Q100,100 112,100 L220,100 L220,500 L112,500 Q100,500 100,488 Z" fill="#f8f9fc"/>
        
        <!-- Sidebar Items -->
        <circle cx="160" cy="150" r="30" fill="#4e73df"/>
        <rect x="130" y="210" width="60" height="8" rx="4" fill="#e3e6f0"/>
        <rect x="130" y="235" width="60" height="8" rx="4" fill="#e3e6f0"/>
        <rect x="130" y="260" width="60" height="8" rx="4" fill="#e3e6f0"/>
        
        <!-- Header -->
        <rect x="240" y="120" width="440" height="50" rx="6" fill="#f8f9fc"/>
        
        <!-- Content Cards -->
        <rect x="240" y="190" width="130" height="90" rx="8" fill="#4e73df" opacity="0.1"/>
        <rect x="255" y="205" width="30" height="30" rx="6" fill="#4e73df"/>
        <rect x="255" y="250" width="60" height="6" rx="3" fill="#4e73df" opacity="0.5"/>
        
        <rect x="395" y="190" width="130" height="90" rx="8" fill="#1cc88a" opacity="0.1"/>
        <rect x="410" y="205" width="30" height="30" rx="6" fill="#1cc88a"/>
        <rect x="410" y="250" width="60" height="6" rx="3" fill="#1cc88a" opacity="0.5"/>
        
        <rect x="550" y="190" width="130" height="90" rx="8" fill="#f6c23e" opacity="0.1"/>
        <rect x="565" y="205" width="30" height="30" rx="6" fill="#f6c23e"/>
        <rect x="565" y="250" width="60" height="6" rx="3" fill="#f6c23e" opacity="0.5"/>
        
        <!-- Chart Section -->
        <rect x="240" y="300" width="440" height="180" rx="8" fill="#ffffff" stroke="#f1f3f9" stroke-width="2"/>
        
        <!-- Chart Line -->
        <path d="M260,440 L320,380 L380,410 L440,350 L500,390 L560,330 L620,360" 
              fill="none" stroke="#4e73df" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
        
        <!-- Chart Area Fill -->
        <path d="M260,440 L320,380 L380,410 L440,350 L500,390 L560,330 L620,360 V460 H260 Z" 
              fill="url(#primaryGrad)" opacity="0.1"/>
    </g>
    
    <!-- Floating Decorative Elements -->
    <circle cx="720" cy="150" r="50" fill="url(#primaryGrad)" opacity="0.8"/>
    <rect x="50" y="400" width="80" height="80" rx="20" fill="url(#successGrad)" transform="rotate(-20 90 440)" opacity="0.8"/>
    
    <!-- Graduation Cap -->
    <g transform="translate(650, 450) rotate(15)">
        <path d="M0,25 L60,0 L120,25 L60,50 Z" fill="#2c3e50"/>
        <path d="M120,25 L120,55 Q60,80 0,55 L0,25" fill="#34495e"/>
        <line x1="120" y1="25" x2="120" y2="65" stroke="#f6c23e" stroke-width="3"/>
        <circle cx="120" cy="65" r="6" fill="#f6c23e"/>
    </g>
</svg>